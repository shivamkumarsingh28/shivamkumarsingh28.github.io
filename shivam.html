<!DOCTYPE html>

  <meta name="description" content="Personal Portfolio — Full Stack Developer" />
  <title>Portfolio — Shivam Kumar Singh</title>

<body>

  <!-- Grain/Noise Texture Overlay -->

  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>

  <!-- Custom Cursor (desktop only) -->
  <div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>

        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">

            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="hamburger" id="hamburger" aria-label="Toggle mobile menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>

  <div class="mobile-menu" id="mobileMenu" role="dialog" aria-label="Navigation menu">
    <ul role="list">

      <li style="--i:3"><a href="#/blog" class="mobile-link" data-route="blog">Blog</a></li>
